# Diagnostic paper-candidate profile for a true stream-updating detector pilot.
# RareCLIP processes images online and updates its memory during stream
# traversal. The Reservoir policy bounds that online memory; this diagnostic
# checks whether matched i.i.d./bursty streams produce non-zero Delta B-I.
run_tier: paper_candidate
paper_allowed: false
claim_allowed: false
review_status: review_pending
output_root: results/latest/paper_candidate/diagnostic_online_memory
paper_candidate_stream_length: 128
patchcore_sampler_percentage: 0.1
candidate_scope: category_shard
datasets:
  - MVTec AD
baselines:
  - RareCLIP
stream_types:
  - iid
  - bursty
contamination_epsilon:
  - 0
  - 0.05
calibration:
  - none
seeds:
  - 0
  - 1
  - 2
  - 3
  - 4
memory_policies:
  RareCLIP:
    - Reservoir
source_tier: paper_candidate
source_tier_notes: Diagnostic true-online memory pilot; outputs remain paper_allowed=false and claim_allowed=false.
