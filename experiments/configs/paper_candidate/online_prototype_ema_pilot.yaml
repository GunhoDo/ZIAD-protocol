# Diagnostic paper-candidate profile for a lightweight true-online detector.
# OnlinePrototypeEMA scores each image against the previous online prototype and
# updates that prototype after every stream item. It is a protocol diagnostic,
# not a leaderboard baseline.
run_tier: paper_candidate
paper_allowed: false
claim_allowed: false
review_status: review_pending
output_root: results/latest/paper_candidate/diagnostic_online_prototype_ema
paper_candidate_stream_length: 128
patchcore_sampler_percentage: 0.1
candidate_scope: category_shard
datasets:
  - MVTec AD
baselines:
  - OnlinePrototypeEMA
stream_types:
  - iid
  - bursty
contamination_epsilon:
  - 0
  - 0.05
calibration:
  - none
seeds:
  - 0
  - 1
  - 2
  - 3
  - 4
memory_policies:
  OnlinePrototypeEMA:
    - Prototype-EMA
source_tier: paper_candidate
source_tier_notes: Lightweight true-online diagnostic; outputs remain paper_allowed=false and claim_allowed=false.
